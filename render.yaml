services:
 - type: web
   name: directus-kb
   runtime: docker
   dockerfilePath: ./Dockerfile
   plan: free
   envVars:
     - key: DB_CLIENT
       value: "pg"
     - key: DB_SEARCH_PATH
       value: "directus"
     - key: DB_POOL_MIN
       value: "0"
     - key: ADMIN_EMAIL
       value: "jyrac.directus@render.stki.org"
     - key: PUBLIC_URL
       value: "https://directus.jyrac.stki.org"
     - key: AUTH_PROVIDERS
       value: "casdoor"
     - key: AUTH_CASDOOR_DRIVER
       value: "openid"
     - key: AUTH_CASDOOR_CLIENT_ID
       value: "fdeb8a106bd6fdede008"
     - key: AUTH_CASDOOR_ISSUER_URL
       value: "https://auth.jyrac.stki.org/.well-known/openid-configuration"
     - key: AUTH_CASDOOR_SCOPE
       value: "openid profile email"
     - key: AUTH_CASDOOR_ALLOW_PUBLIC_REGISTRATION
       value: "true"
     - key: AUTH_CASDOOR_DEFAULT_ROLE_ID
       value: "33d8a058-81e0-4292-b58f-3ab9f3dcb84a"
     - key: AUTH_CASDOOR_ICON
       value: "account_circle"
     - key: AUTH_CASDOOR_LABEL
       value: "Casdoor"
     - key: STORAGE_LOCATIONS
       value: "gdrive"
     - key: STORAGE_GDRIVE_DRIVER
       value: "s3"
     - key: STORAGE_GDRIVE_BUCKET
       value: "directus-files"
     # rclone の公開側は閉じた。NetBird 経由の転送（netbird-forward.js）に向ける（entrypoint.sh も、同じ値で上書きする）
     - key: STORAGE_GDRIVE_ENDPOINT
       value: "http://127.0.0.1:9000"
     - key: STORAGE_GDRIVE_REGION
       value: "us-east-1"
     - key: STORAGE_GDRIVE_FORCE_PATH_STYLE
       value: "true"
     - key: AWS_REQUEST_CHECKSUM_CALCULATION
       value: "WHEN_REQUIRED"
     - key: AWS_RESPONSE_CHECKSUM_VALIDATION
       value: "WHEN_REQUIRED"
     - key: LOG_LEVEL
       value: "info"
     - key: LOG_STYLE
       value: "raw"
     - key: LOG_HTTP_IGNORE_PATHS
       value: "/server/ping,/server/health"
     - key: IP_CUSTOM_HEADER
       value: "cf-connecting-ip"
     # ---- IPゲート（GATE_DB_USER / GATE_DB_PASSWORD は、Agentが出すので、ここには書かない）----
     # GATE_CHILD_CMD / GATE_CHILD_ENV / GATE_UPSTREAM / GATE_UPSTREAM_HEALTH_PATH は、Dockerfile で設定済み
     - key: GATE_MODE
       value: "observe"
     - key: GATE_PUBLIC_RULES
       value: "directus_news"
     - key: GATE_DB_HOST
       value: "aws-0-us-west-2.pooler.supabase.com"
     - key: GATE_DB_PORT
       value: "6543"
     - key: GATE_DB_NAME
       value: "postgres"
     - key: GATE_DB_SSLMODE
       value: "require"
     - key: GATE_DENIED_URL
       value: "https://gate.jyrac.stki.org/denied"
     - key: GATE_REDIRECT_URL
       value: "https://gate.jyrac.stki.org/"
     # ---- NetBird（OpenBao へ、NetBird 経由で接続する）----
     # NB_SETUP_KEY は、deploy-secrets.yml が、デプロイのたびに作って渡すので、ここには書かない
     - key: NB_HOSTNAME
       value: "directus"
     - key: OPENBAO_NB_ADDR
       value: "https://100.125.124.43:8210"   # ← OpenBao の NetBird の IP に書き換える（名前では引けない）
     # rclone への NetBird 経由の接続先（rclone の NetBird の IP:8210。IPv4 のみ、名前は引けない）。
     # 空だと、rclone に届かず、ファイルの保存、取得ができない（公開側は閉じた）。
     - key: RCLONE_NB_ADDR
       value: "100.125.61.26:8210"